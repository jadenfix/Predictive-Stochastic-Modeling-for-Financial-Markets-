[project]
name = "psm"
version = "2.0.0"
description = "Predictive Stochastic Modeling for Financial Markets, revised edition"
authors = [{ name = "Jaden Fix" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14.4",
    "matplotlib>=3.9",
    "typst>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
