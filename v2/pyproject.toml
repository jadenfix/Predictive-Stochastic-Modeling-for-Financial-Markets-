[project]
name = "psm-thesis"
version = "2.1.0"
description = "Predictive Stochastic Modeling for Financial Markets, revised edition (single-script pipeline)"
authors = [{ name = "Jaden Fix" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14.4",
    "scikit-learn>=1.8",
    "matplotlib>=3.9",
    "xlrd>=2.0.1",
    "typst>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pypdfium2>=4.30",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
